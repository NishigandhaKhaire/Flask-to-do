<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart To-Do App</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
        }

        .container-box {
            background: white;
            color: black;
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .navbar {
            background: rgba(0,0,0,0.3);
        }

        .task-completed {
            text-decoration: line-through;
            color: gray;
        }

        .badge-high { background: #ff4d4d; }
        .badge-medium { background: #ffa500; }
        .badge-low { background: #28a745; }

        .btn-custom {
            border-radius: 20px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark px-4">
    <a class="navbar-brand" href="/">🚀 Smart ToDo</a>

    <div class="ms-auto">
        <a href="/" class="btn btn-light btn-sm btn-custom">Home</a>
        <a href="/add" class="btn btn-warning btn-sm btn-custom">Add Task</a>
        <a href="/about" class="btn btn-info btn-sm btn-custom">About</a>
    </div>
</nav>

<div class="container">
    <div class="container-box">
        {% block content %}{% endblock %}
    </div>
</div>

</body>
</html>
