{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">📊 Dashboard</h2>

<div class="row text-center mb-4">
    <div class="col">
        <div class="card p-3 shadow">
            <h5>Total</h5>
            <h3>{{ total }}</h3>
        </div>
    </div>
    <div class="col">
        <div class="card p-3 shadow">
            <h5>Completed</h5>
            <h3>{{ completed }}</h3>
        </div>
    </div>
    <div class="col">
        <div class="card p-3 shadow">
            <h5>Pending</h5>
            <h3>{{ pending }}</h3>
        </div>
    </div>
</div>

<h4>📝 Task List</h4>

<ul class="list-group">
    {% for task in tasks %}
    <li class="list-group-item d-flex justify-content-between align-items-center">

        <div>
            <span class="{{ 'task-completed' if task.status == 'Completed' }}">
                {{ task.title }}
            </span>

            <span class="badge 
                {% if task.priority == 'High' %}badge-high
                {% elif task.priority == 'Medium' %}badge-medium
                {% else %}badge-low
                {% endif %}
                text-white ms-2">
                {{ task.priority }}
            </span>
        </div>

        <div>
            <a href="/toggle/{{ task.id }}" class="btn btn-success btn-sm">✔</a>
            <a href="/delete/{{ task.id }}" class="btn btn-danger btn-sm">🗑</a>
            <a href="/task/{{ task.id }}" class="btn btn-primary btn-sm">👁</a>
        </div>

    </li>
    {% endfor %}
</ul>

{% endblock %}
